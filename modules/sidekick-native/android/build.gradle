plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.sidekick.engine'
version = '0.1.0'

android {
  namespace "dev.sidekick.engine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "consumer-rules.pro"
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17"
      }
    }
  }
  // JNI bridge to ONNX Runtime for photo OCR (src/main/cpp/ort_shim.cpp).
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }
  if (rootProject.ext.has("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Google LiteRT-LM (Apache-2.0): on-device Gemma with CPU / GPU / NPU backends.
  implementation "com.google.ai.edge.litertlm:litertlm-android:0.19.1"
  // sherpa-onnx (Apache-2.0): VAD, wake word, speech-to-text, speaker embeddings. JitPack re-hosts
  // the official release AAR (v2.0.3's JitPack build failed, so v2.0.2).
  implementation "com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v2.0.2"
  // Apache Commons Compress (Apache-2.0): unpacks the speech model archives.
  implementation "org.apache.commons:commons-compress:1.28.0"
  implementation "androidx.core:core-ktx:1.13.1"
  // React Native (MIT, already in the app): HeadlessJsTaskService runs routines without a screen.
  implementation "com.facebook.react:react-android"
  // Google Identity Services (Android SDK licence, free for commercial use): Authorization API
  // for the gmail.send scope only. Used only when the user sends an email (ADR 0008).
  implementation "com.google.android.gms:play-services-auth:22.0.0"
  // CameraX (Apache-2.0), same version as expo-camera: the phone camera for live memory, no screen needed.
  implementation "androidx.camera:camera-core:1.6.0"
  implementation "androidx.camera:camera-camera2:1.6.0"
  implementation "androidx.camera:camera-lifecycle:1.6.0"
  // UVCAndroid (Apache-2.0; bundles libuvc BSD, libusb LGPL-2.1 as a separate .so, libjpeg-turbo,
  // libyuv BSD): USB (UVC) cameras. hutool is declared by the library but not used by it.
  implementation("com.herohan:UVCAndroid:1.0.13") {
    exclude group: "cn.hutool"
  }
  // ZXing core (Apache-2.0): QR codes and barcodes on the phone (ML Kit sends usage data to Google).
  implementation "com.google.zxing:core:3.5.3"
  // Plain JVM tests of the pure logic (Turns.kt).
  testImplementation "junit:junit:4.13.2"
}
