name: Android emulator checks
# The Android flows without a phone: builds this commit for the x86_64 emulator on a free GitHub
# runner (public repo, standard ubuntu-latest with KVM), boots an Android emulator, gives the app
# the chat model and memory search, and drives the real app with scripts/android-emu.sh: first
# run, the interpreter-not-open reply, a pasted table, every file type, a recording's play button,
# settings by voice (Approve), the offline queue, folder search, the send queue with Stop, and
# the DELETE sheet. Gemma runs on the emulator's CPU, so a full run takes an hour or two.
# Logs, screen texts and screenshots are kept as the "android-emu-logs" artefact.
#   gh workflow run android-emu.yml [-f flows="pasted_table file_types"] [-f apk_run=<run id>]
# or push a branch named android-emu/<anything>. apk_run reuses the APK of an earlier run (no
# build); first_run always runs first, since the other flows need a set-up app.
on:
  push:
    branches: ['android-emu/**']
  workflow_dispatch:
    inputs:
      flows:
        description: Flows to run after first_run, space-separated (empty runs all)
        type: string
        default: ''
      apk_run:
        description: Reuse the APK from this earlier run of this workflow (empty builds one)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: android-emu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !inputs.apk_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Release variant (JS bundled in, debug-signed), x86_64 only: the emulator's own CPU runs
      # the model at a usable speed; ARM code under translation would be far too slow.
      - run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
        working-directory: android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidekick-emu-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  emulator:
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      LOGS: ${{ github.workspace }}/logs
      FILES: ${{ github.workspace }}/test-files
      MODELS: ${{ github.workspace }}/../emu-models
      FLOWS: ${{ inputs.flows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sidekick-emu-apk
          path: apk
          run-id: ${{ inputs.apk_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          df -h / | tail -1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../emu-models
          key: emu-models-${{ hashFiles('src/engine/models.ts') }}
          restore-keys: emu-models-
      - name: Models
        # The same download and checksum check as the iPhone Simulator run.
        run: scripts/ios-sim.sh models "$MODELS"
      - name: Emulator, flows
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 8192M
          heap-size: 512M
          disk-size: 16G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            scripts/android-emu.sh setup apk/app-release.apk "$MODELS"
            scripts/android-emu.sh run $FLOWS
      - name: Results
        if: always()
        run: |
          {
            echo '### Android emulator flows'
            echo '```'
            cat "$LOGS/results.txt" 2>/dev/null || echo 'no results'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-emu-logs
          path: logs/
          retention-days: 14
